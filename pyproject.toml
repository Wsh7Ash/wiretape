[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wiretape"
version = "1.0.0"
description = "Record, replay, extract and export raw HTTP exchanges, and run request+command tapes, without a proxy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["http", "replay", "burp-alternative", "bug-bounty", "har", "tape", "security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wiretape = "wiretape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
